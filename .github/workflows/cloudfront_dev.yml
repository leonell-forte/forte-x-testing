name: DEVELOPMENT Deploy React App to CloudFront

on:
  push:
    branches:
      - development

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack (Deployment Started)
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🟡 *Frontend Deployment Started* for `development` branch.\nBuilding and deploying React app to CloudFront... ⏳"}' \
          ${{ secrets.SLACK_WEBHOOK_URL_DEV }}

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Inject Environment Variables
        run: |
          echo "REACT_APP_AMPLITUDE_API_KEY=${{ secrets.REACT_APP_AMPLITUDE_API_KEY_DEV }}" >> .env
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL_DEV }}" >> .env
          echo "REACT_APP_DATOCMS_TOKEN=${{ secrets.REACT_APP_DATOCMS_TOKEN }}" >> .env
          echo "REACT_APP_DATOCMS_API_URL=${{ secrets.REACT_APP_DATOCMS_API_URL }}" >> .env
          echo "REACT_APP_ENVIRONMENT=${{ secrets.REACT_APP_ENVIRONMENT_DEV }}" >> .env

      - name: Build project
        run: npm run build

      - name: List directory contents
        run: pwd; ls -l

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync $GITHUB_WORKSPACE/out s3://${{ secrets.S3_BUCKET_NAME }} --region ${{ secrets.AWS_REGION }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Notify Slack (Deployment Successful)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ *Frontend Deployment Successful!* React app is live on CloudFront from the `development` branch 🚀"}' \
          ${{ secrets.SLACK_WEBHOOK_URL_DEV }}

      - name: Notify Slack (Deployment Failed)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ *Frontend Deployment Failed* for `development` branch. Please check GitHub Actions logs 🧯"}' \
          ${{ secrets.SLACK_WEBHOOK_URL_DEV }}
